<!doctype html><html><head><meta charset="utf-8"><title>fintrace · Rupiah Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Barlow',sans-serif;background:#F3F4F1;color:#16181A;font-variant-numeric:tabular-nums}
.head{background:#D2343B;color:#fff;padding:52px 20px 22px;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 1px,transparent 1px 7px)}
.top{display:flex;justify-content:space-between;font-size:13px;font-weight:500}
.top b{font-family:'Barlow Semi Condensed';font-size:17px;font-weight:800}
.lab{margin-top:18px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.big{font-family:'Barlow Semi Condensed';font-size:46px;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.sub{font-size:13px;opacity:.9}
.rec{margin-top:18px;height:60px;background:#fff;color:#D2343B;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Semi Condensed';font-size:22px;font-weight:800}
h2{font-family:'Barlow Semi Condensed';font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:22px 20px 8px;color:#55585c}
.acc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 20px}
.a{background:#fff;border-radius:4px;padding:10px;border-top:6px solid}
.a small{font-size:12px;color:#55585c}
.a b{display:block;font-family:'Barlow Semi Condensed';font-size:19px;font-weight:800;margin-top:2px}
.env{margin:0 20px;background:#fff;border-radius:4px}
.e{display:flex;align-items:center;gap:12px;padding:11px 12px;border-top:1px solid #E6E7E3}
.e:first-child{border-top:0}
.sw{width:28px;height:18px;border-radius:2px}
.e span{flex:1;font-size:15px}
.e b{font-family:'Barlow Semi Condensed';font-size:18px;font-weight:800}
.neg{color:#D2343B}
</style></head><body>
<div class="head">
 <div class="top"><b>fintrace</b><span>25 Oct – 24 Nov · 17 days left</span></div>
 <div class="lab">Usable funds</div>
 <div class="big">Rp 2.418.500</div>
 <div class="sub">Total funds Rp 2.915.300 · Cash, Mandiri, Jago</div>
 <div class="rec">+ Catat</div>
</div>
<h2>Accounts</h2>
<div class="acc">
 <div class="a" style="border-color:#1E5AA8"><small>Mandiri</small><b>1.204.000</b></div>
 <div class="a" style="border-color:#2E8B57"><small>Jago</small><b>968.500</b></div>
 <div class="a" style="border-color:#7B3F98"><small>Cash</small><b>283.000</b></div>
</div>
<h2>Envelopes · left</h2>
<div class="env">
 <div class="e"><i class="sw" style="background:#2E8B57"></i><span>Meal</span><b>Rp 412.000</b></div>
 <div class="e"><i class="sw" style="background:#8A5A2B"></i><span>Fuel</span><b>Rp 96.000</b></div>
 <div class="e"><i class="sw" style="background:#1E5AA8"></i><span>Internet</span><b>Rp 0</b></div>
 <div class="e"><i class="sw" style="background:#7B3F98"></i><span>Wants</span><b class="neg">-Rp 42.000</b></div>
</div>
</body></html>
