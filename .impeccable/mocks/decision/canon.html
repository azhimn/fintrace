<!doctype html><html><head><meta charset="utf-8"><title>fintrace · standard</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Geist',sans-serif;background:#F3F4F6;color:#111827;font-variant-numeric:tabular-nums;position:relative}
header{padding:52px 20px 8px;display:flex;justify-content:space-between;align-items:baseline}
header b{font-size:18px}header span{font-size:13px;color:#6B7280}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 20px}
.c{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.c.w{grid-column:span 2}
.c small{font-size:12px;color:#6B7280}.c b{display:block;font-size:20px;font-weight:700;margin-top:4px}
.c.w b{font-size:32px}
h2{font-size:14px;font-weight:600;margin:16px 20px 8px}
.l{margin:0 20px;background:#fff;border-radius:16px;padding:4px 14px}
.r{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid #F3F4F6;font-size:15px}.r:first-child{border:0}
.bar{height:6px;background:#E5E7EB;border-radius:9px;margin:-4px 0 10px}.bar div{height:100%;background:#0F766E;border-radius:9px}
.fab{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#0F766E;color:#fff;border-radius:999px;padding:16px 32px;font-weight:600;font-size:17px;box-shadow:0 8px 20px rgba(15,118,110,.35)}
.neg{color:#DC2626}
</style></head><body>
<header><b>fintrace</b><span>17 days left</span></header>
<div class="cards">
 <div class="c w"><small>Usable funds</small><b>Rp 2.418.500</b></div>
 <div class="c"><small>Total funds</small><b>Rp 2.915.300</b></div>
 <div class="c"><small>Projected remainder</small><b>Rp 310.000</b></div>
</div>
<h2>Accounts</h2>
<div class="l"><div class="r"><span>Mandiri</span><b>Rp 1.204.000</b></div><div class="r"><span>Jago</span><b>Rp 968.500</b></div><div class="r"><span>Cash</span><b>Rp 283.000</b></div></div>
<h2>Envelopes</h2>
<div class="l"><div class="r"><span>Meal</span><b>Rp 412.000</b></div><div class="bar"><div style="width:58%"></div></div><div class="r"><span>Wants</span><b class="neg">-Rp 42.000</b></div><div class="bar"><div style="width:100%;background:#DC2626"></div></div></div>
<div class="fab">+ Catat</div>
</body></html>
