<!doctype html><html><head><meta charset="utf-8"><title>fintrace · Amplop Gaji</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Hanken Grotesk',sans-serif;background:#F6F7F9;color:#1B1A17;font-variant-numeric:tabular-nums}
.band{background:#B4804C;color:#1B1A17;padding:52px 20px 20px;position:relative}
.band .row{display:flex;justify-content:space-between;align-items:baseline}
.brand{font-weight:800;font-size:16px;letter-spacing:.01em}
.cyc{font-size:13px;font-weight:500}
.window{margin-top:16px;background:#F6F7F9;border-radius:6px;padding:14px 16px;box-shadow:inset 0 0 0 1px #8F6438}
.window small{font-size:12px;font-weight:600;color:#5b4a3a;display:block}
.window b{font-size:36px;font-weight:800;letter-spacing:-.02em;display:block;margin-top:2px}
.window span{font-size:13px;color:#5b4a3a}
.flap{height:12px;background:linear-gradient(135deg,#B4804C 50%,transparent 50%) 0 0/16px 12px repeat-x}
.rec{margin:16px 20px 0;height:64px;border-radius:6px;background:#1F3FB5;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:800}
.rec i{font-style:normal;font-size:28px;line-height:1}
h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6b6760;margin:22px 20px 8px}
.list{margin:0 20px;background:#fff;border-radius:6px;box-shadow:0 0 0 1px #E3E4E8}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-top:1px solid #EDEEF1;font-size:15px}
.li:first-child{border-top:0}
.li em{font-style:normal;font-size:12px;color:#6b6760;margin-left:6px}
.env{padding:10px 14px;border-top:1px solid #EDEEF1}
.env:first-child{border-top:0}
.env .t{display:flex;justify-content:space-between;font-size:15px}
.bar{height:6px;border-radius:3px;background:#EDEEF1;margin-top:8px;overflow:hidden}
.bar div{height:100%}
.neg{color:#C62828;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px}
</style></head><body>
<div class="band">
 <div class="row"><span class="brand">fintrace</span><span class="cyc">25 Oct – 24 Nov · 17 days left</span></div>
 <div class="window"><small>Usable funds · Cash, Mandiri, Jago</small><b>Rp 2.418.500</b><span>Total funds Rp 2.915.300</span></div>
</div>
<div class="flap"></div>
<div class="rec"><i>+</i>Catat</div>
<h2>Accounts</h2>
<div class="list">
 <div class="li"><span>Mandiri<em>min Rp 37.000</em></span><b>Rp 1.204.000</b></div>
 <div class="li"><span>Jago</span><b>Rp 968.500</b></div>
 <div class="li"><span>Cash</span><b>Rp 283.000</b></div>
</div>
<h2>Envelopes</h2>
<div class="list">
 <div class="env"><div class="t"><span><i class="dot" style="background:#2E7D5B"></i>Meal</span><b>Rp 412.000 left</b></div><div class="bar"><div style="width:58%;background:#2E7D5B"></div></div></div>
 <div class="env"><div class="t"><span><i class="dot" style="background:#C77B12"></i>Fuel</span><b>Rp 96.000 left</b></div><div class="bar"><div style="width:76%;background:#C77B12"></div></div></div>
 <div class="env"><div class="t"><span><i class="dot" style="background:#7A4BB0"></i>Wants</span><b class="neg">-Rp 42.000</b></div><div class="bar"><div style="width:100%;background:#C62828"></div></div></div>
</div>
</body></html>
